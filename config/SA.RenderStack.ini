[Backend]
; Rendering backend used after the wrapper registry finishes.
; DXVK: use the merged Vulkan backend built into this d3d9.dll. Recommended.
; SystemD3D9: forward final D3D9 creation to Windows' system d3d9.dll.
; Use SystemD3D9 only for troubleshooting wrapper-chain or DXVK-specific issues.
Backend=DXVK
; Legacy compatibility keys. Backend= above is the real selector.
UseDxvkBackend=1
DxvkBackendDir=backend\dxvk-gta

[DXVKDiagnostics]
; Temporary full diagnostic profile. Each game launch creates a separate
; Diagnostics\DXVK\<timestamp>-pid<id> directory so previous captures survive.
; trace is the most verbose level supported by this DXVK 3.0.1 build.
Enable=1
OutputDir=Diagnostics\DXVK
LogLevel=info
; 2026-07-26 E-items: HUD trimmed (gpuload/cs/memory issue per-frame queries).
Hud=fps,frametimes
Debug=off
StatsLog=0
FrameTimeLog=0
DumpShaders=0

[Affinity]
; Optional CPU tuning applied when the game loads this d3d9.dll.
; Mask=0xFFFC binds the process to logical CPUs 2-15 on the current machine.
; Priority can be Idle, BelowNormal, Normal, AboveNormal, High, or Realtime.
; High is recommended. Realtime can make input/audio/system threads stall.
; Reapply keeps restoring the mask/priority during startup in case another
; module or compatibility layer resets them after this DLL loads.
Enable=1
; 2026-07-26 E-items: open all 32 logical CPUs so DXVK CS/compiler threads can
; use E-cores instead of competing with the render thread on CPUs 2-15.
; 2026-08-03 A/B (single variable, this line only). Verified topology on this
; machine: i9-14900HX, 8 P-cores (logical 0-15, 2200 MHz base) + 16 E-cores
; (logical 16-31, 1600 MHz base). Hypothesis under test is the Universal
; Scalability Law coherency term: letting DXVK's CS/compiler threads migrate to
; E-cores may cost more in cross-core cache traffic and E-core stalls than it
; buys in parallelism, i.e. the 7/26 widening could be a net loss.
;   0xFFFFFFFF = all 32 logical CPUs (7/26 baseline, and the value restored below)
;   0xFFFF     = the 8 P-cores only
; RESULT (08-03 22:43, mask verified applied: "affinityChanged=1 applied=1 err=0"):
; fps=42.20 against a 7/29 same-config spread of 43.1-47.2 (median ~44.4) — inside
; the noise, and the four-layer module split was unchanged (DXVK 27.0 / gta_sa 21.0 /
; d3dx9 16.1 / bridge 9.3 / PS 7.1, matching the 7/26 21:32 structural baseline).
; If E-cores had been carrying real work, removing them would have moved one of
; those layers. Verdict: no measurable coherency penalty, so the USL hypothesis
; ("opening all 32 CPUs is a net loss") is refuted. Restored to 0xFFFFFFFF because
; at equal performance it keeps E-cores available for DXVK's compiler threads.
; Do not re-run this A/B without a new reason.
Mask=0xFFFFFFFF
Priority=High
Reapply=1
ReapplyCount=60
ReapplyIntervalMs=2000

[ProxyChain]
; Enable the ordered wrapper/ASI registry below.
; Load order is defined in [register] with numeric keys.
Enable=1
; Do not implicitly load the unrelated 2006 d3d9_ps.dll wrapper.
LegacyAutoProbeD3D9PS=0
; 2026-07-26 unwrap build: the game now talks to the DXVK device directly.
; Set 1 to restore the legacy per-call device wrapper (needed only for
; F9/F10/D3D9Stats style diagnostics or as an emergency rollback switch).
ForceDeviceWrap=0

[D3D9Stats]
; Lightweight aggregate D3D9 call counter for performance diagnosis.
; This logs one summary line every IntervalMs to scripts\BridgeD3D9.log.
; Layer is game-to-primary-proxy when ProperShaders owns the D3D9 proxy path.
; 2026-07-26: OFF — stats require the per-call device wrapper, which the
; unwrap build removes from the hot path. Set Enable=1 (auto re-wraps) only
; for diagnosis runs, e.g. if the black loading screen returns.
Enable=0
IntervalMs=1000

[D3D9Trace]
; Press F10 while a rendering artifact is visible to capture the next presented
; frame's draw states in scripts\BridgeD3D9.drawtrace.log.
; The trace is read-only: it queries the primary proxy and never changes state.
Enable=0
TriggerVirtualKey=121
MaxDraws=12000

[D3D9CallsiteProfile]
; Press F9 for a standalone capture. It is blocked while F8 CPU sampling runs.
; The bridge samples one call stack for every SampleEveryDraws draw calls over
; CaptureFrames frames, then writes scripts\BridgeD3D9.callsites.log.
; The ghidra address in each row opens directly in the GTASA_10US project.
Enable=0
TriggerVirtualKey=120
CaptureFrames=120
SampleEveryDraws=512

[CPUHotspotProfile]
; Press F8 in the slow scene to save a screenshot and sample the GTA render/main
; thread for DurationMs. This remains a clean CPU-only capture by default.
; This runs inside the bridge, so it does not require administrator ETW access.
; Screenshots go to Diagnostics\CPU and the report groups actual CPU instruction
; time by module/address in scripts\BridgeD3D9.cpuhotspots.log.
Enable=1
TriggerVirtualKey=119
DurationMs=10000
IntervalMs=5
; Set 1 only for a deliberate combined run. It starts the higher-overhead F9
; callsite stage after F8 completes and links both reports by capture ID.
ChainD3D9CallsiteProfile=0

[ProperShadersEffectOptimization]
; Replaces D3DXEffect's full per-object state save with an incremental journal.
; Only states actually changed by ProperShaders are captured and restored.
; Effects with another state manager or any capture failure stay on the original path.
Enable=1
StateJournal=1
; Apply the incremental state journal to every Effect created by ProperShaders,
; removing D3DX full state-block Capture/Apply from shadows, vehicles and post FX.
GeneralStateJournal=1
; Batch consecutive Debug-effect objects into one Begin/End transaction.
; The bridge reads the verified ProperShaders loop counter and falls back if unavailable.
; 2026-07-26: repaired and re-enabled. The old code read the technique out of
; the single global batch slot AFTER a flush had just cleared it, so every new
; batch was rejected with reason=technique and batching never started (that is
; why it was switched off on 7/19). The technique is now tracked per effect.
; Target: the 5,582 Begin + BeginPass + End triples per frame (~9.7 ms).
; 2026-07-26 20:1x: DISABLED after a crash at gta_sa.exe+0x9D972 during a run
; with batching on. Not yet proven guilty, but it is the newest variable and a
; crash outranks a perf experiment. Re-test only after the crash is explained.
BatchConsecutiveEffects=0
; Skip byte-identical matrix writes for the same Effect parameter within one frame.
; 2026-08-03: briefly set to 0 for one journal-probe calibration run, then restored.
; That run proved these three filters hide half the probe's data (LitPrelight_Deferred
; slots 13 -> 26), because a byte-identical write is dropped here, D3DX never marks
; the parameter dirty, CommitChanges never resubmits, and the journal never sees it.
; Any future state-write measurement must turn all three off, and put them back.
SkipDuplicateMatrices=1
; Skip byte-identical vectors and float arrays inside the active Effect transaction.
SkipDuplicateParameters=1
; Submit verified LitPrelight constants and textures directly to D3D9, bypassing
; per-object D3DX CommitChanges. Shader hashes and effect signatures must match.
DirectConstants=1
; 2026-07-26: A/B lever. 1 = journal capture/restore runs inside DXVK via the
; api7 native interface (two cross-DLL toggles per effect transaction).
; 0 = journal stays local to the bridge (the proven 7/16 +11.6% path).
; 2026-07-26 19:2x A/B RESULT: native (1) wins. Local journal moved 3.4pp of
; work into the bridge (10.37% -> 13.81% of render-thread samples) and fps fell
; 49.6 -> 41.3. Keep 1; the capture/restore belongs inside DXVK.
NativeStateJournal=1
; 2026-07-26: raw dump captured and analysed (192KB, verdict: generalisation
; feasible). Off now; the dry run below is the next validation step.
InspectEffects=0
; 2026-07-26 dry-run RESULT: 51 techniques DIRECT-OK, 3 FALLBACK (all
; multi-pass post FX: HBAO etc., once-per-frame, fine on D3DX). Every hot-path
; technique green with zero unsupported params. Off until the live submitter
; is implemented.
GenericDirectDryRun=0
; Stage ①-3b-i: live validation of the CTAB-driven plans. Builds plans at
; effect creation and logs "genericdirect: live-hit technique=..." from the
; CommitChanges hook when a plan matches the bound technique. No rendering
; change yet — the direct submitter lands after this validates.
; 2026-07-27: also back to 0. v1 (shadow store + direct constant submission)
; was measured correct and visually clean, but performance-neutral: d3dx9 went
; 17.51% -> 17.42% because it only covered techniques outside the two hot
; families. No gain is not worth the extra moving parts in the hot path.
GenericDirect=0
; Stage B pass-lite: per technique, record the exact state sequence D3DX
; applies (the journal is the state manager, so it sees everything), record it
; a second time, and only when both recordings agree does the technique switch
; to replay mode — after which its D3DX Begin/BeginPass/EndPass/End never run.
; Dynamic values (matrices/vectors/scalars via hooked setters, textures) come
; from the shadow stores. Skinned techniques are auto-excluded (bone arrays).
; Set 0 to fall back to plain GenericDirect; rendering anomaly -> also try
; GenericDirect=0 or restore d3d9.dll.before-passlite-20260726.bak.
; 2026-07-27: DISABLED — structural dead end, not a fixable bug. See below.
; The replay list only ever contained per-FRAME post-processing techniques
; (SoftParticles, ShadowBlurV, DeferredLighting/Lights/Composite, Blur_Radius1,
; CombineClouds) — which is exactly the set of effects that broke, and exactly
; the set with no performance upside (a handful of Begin/End calls per frame).
; The per-OBJECT techniques that hold the real D3DX cost (LitPrelight and
; DepthPass, thousands of transactions per frame) never validated: their pass
; state legitimately differs between objects, so the two recordings diverge and
; the technique self-disables. Recording-and-replay can only validate what is
; invariant, and what is invariant is what is already cheap.
GenericDirectPassLite=0
; Trace-stability probe (observation only, NOT pass-lite). Records each pass of
; every eligible technique and diffs it slot-by-slot against that technique's
; first recording, accumulating a per-slot stability histogram to
; scripts\BridgeD3D9.tracestab.log. Never replays, never enables direct
; submission — rendering is untouched. Self-contained: this one flag builds the
; CTAB plans and drives the recorder. Turn off (0) and restore the backup dll
; after the recon run. 2026-07-31.
; 2026-08-02 RESULT: this probe cannot see the hot path. It only observes
; techniques that have a CTAB plan AND liteEligible=1, and the two techniques
; that carry the cost (LitPrelight, DepthPass) have no plan at all — 19
; techniques were observed, neither of those among them. Superseded by
; JournalProbe below, which observes at the state-manager level instead.
TraceStabilityProbe=0
; Journal-level trace-stability probe. The journal is every ProperShaders
; effect's state manager, so this sees ALL techniques regardless of plan
; availability or pass-lite eligibility. Each transaction's state writes are
; recorded as (op, key, value-hash) triples into a fixed 512-entry buffer and
; diffed against that technique's first transaction. Per-slot change counts go
; to scripts\BridgeD3D9.tracestab.log every 10s.
; Purely observational: capture/restore, flags, and the native journal path are
; all untouched. Set 0 to disable. 2026-08-02.
; 2026-08-03 RESULT: done, see Docs\perf-d3dx9\03-dead-ends.md §6. The hot
; per-object techniques have no stable slot sequence to hoist out of the object
; loop (LitPrelight_Deferred: 4050 of 4096 transactions differ in the write
; SEQUENCE itself, not just in values), and state writes only account for 5% of
; d3dx9 cost anyway. Third independent refutation of the D3DX state-reuse idea.
; Off now. If re-enabled for a state-write measurement, first set
; SkipDuplicateMatrices / SkipDuplicateParameters / DirectConstants to 0 —
; they hide half the data — and restore them to 1 afterwards.
JournalProbe=0

[ProperShadersEffectProfile]
; Press F7 to profile the current ProperShaders building-effect hot path for
; DurationMs. The bridge temporarily redirects verified call sites, measures
; D3DX SetMatrix/CommitChanges/Begin/End time and exact matrix duplicates, then
; restores every original instruction automatically.
; Disabled while state attribution owns F7.
Enable=0
TriggerVirtualKey=118
DurationMs=3000
; Experimental A/B: skip only byte-identical SetMatrix writes for the same
; effect and parameter during the F7 capture. The verified call-site hooks are
; removed automatically after DurationMs. Keep 0 for a read-only baseline.
TestSkipDuplicateMatrices=0
; Legacy diagnostic option. The state-journal optimizer rejects this unsafe path.
TestNoSaveState=0

[D3D9Optimizer]
; Suppress state writes whose requested D3D9 value is already current.
; KEEP DISABLED — verified broken 2026-07-26 (black quads over the whole scene).
; Root cause: the cache only sees SetXXX calls that pass through this wrapper,
; but device state also mutates through paths it can NOT see:
;   1. IDirect3DStateBlock9::Apply — D3DX effect save/restore uses stateblock
;      OBJECTS which the bridge does not wrap;
;   2. the api7 native journal: RestoreStateJournal() applies a bulk state
;      restore entirely inside DXVK, ~5.5k times per frame.
; After any such restore the cache is stale, redundant-skip decisions are wrong,
; and particles/shadows render as black squares. Redundancy filtering must live
; inside DXVK (which sees all mutations) or at the call source, never here.
Enable=0
SkipRedundantShaders=1
SkipRedundantConstants=1

[LimitCoordinator]
; Coordinates fastman92 Limit Adjuster and Open Limit Adjuster before ASI mods load.
; Keep this disabled for the current FLA++/OLA setup. OLA stays installed, but
; GTA SA pool/list/render limit ownership is handled by FLA++ + fastman92 LA.
; Enable this only for manual coordination tests.
Enable=0
Mode=PreferFLA
CrashGuard=1

[register]
; Rulesmd-style registry.
; Use one entry per line: 1=Name, 2=Name, 3=Name.
; Do not use semicolon-delimited lists here; semicolons are comments in INI files.
; Each registered name must have a matching [Name] section below.
1=ProperShaders
2=ReShade
3=ENB

[ProperShaders]
; ProperShaders installs its own device proxy after GTA creates the DXVK device.
; Observe its claims without adding another external D3D9 wrapper.
Enable=1
Mod=ProperShaders
Type=ObservedASI
asi=modloader\Proper Shaders\ProperShaders.asi
Mode=InternalDeviceProxy
Stage=PostDevice
Claims=DeviceWrap,Depth,ShaderPatch
ConflictPolicy=SkipIfClaimed
Required=0

[ReShade]
; Disabled placeholder. Enable only after installing the referenced DLL and
; after a compatible post-process adapter exists.
Enable=0
Mod=ReShade
Type=PostProcess
dll=ReShade32.dll
Mode=PresentHook
Stage=PostDevice
Claims=Present,EndScene
ConflictPolicy=SkipIfClaimed
Required=0

[ENB]
; Disabled placeholder. ENB is invasive, so keep it disabled unless you are
; explicitly testing a compatible chain setup.
Enable=0
Mod=ENBSeries
Type=D3D9Proxy
dll=enbseries.dll
Mode=Compatibility
Stage=D3D9Create
Claims=D3D9Entry,DeviceWrap,Present,EndScene,Depth,ShaderPatch
ConflictPolicy=SkipIfClaimed
Required=0

[ExampleASI]
; Example ASI entry. This section is not loaded unless [register] contains
; a numeric entry such as 4=ExampleASI.
; asi= uses the same path rules as dll=:
;   asi=MyPlugin.asi                  loads from the GTA root directory
;   asi=scripts\MyPlugin.asi          loads from a path under the GTA root
;   asi=.\plugins\MyPlugin.asi        loads from a relative path under GTA root
;   asi=D:\Mods\MyPlugin.asi          loads from an absolute path
Enable=0
Mod=ExampleASI
Type=ASI
asi=scripts\ExamplePlugin.asi
Claims=
ConflictPolicy=SkipIfClaimed
Required=0

[PostFX]
; Bridge-native plugins. This is separate from legacy D3D9 wrappers above.
; API v1 keeps the D3D9 lifecycle callbacks. API v2 registers native Vulkan
; passes into DXVK's existing Present command buffer without another submit.
; Plugins are loaded left-to-right. API v2 Priority controls pass order;
; equal priorities retain registration order.
EnableHost=0
PluginDir=plugins\d3d9chain
Plugins=

[PerformanceDiagnostics]
; Read-only evidence is collected only after an F8 capture finishes.
; It does not change mod settings, rendering state, or per-frame behavior.
Enable=1
IncludeProcessMemory=1
IncludeConfigSnapshots=1
EnableProviders=1
ProviderSlowWarningUs=2000
; Press F7 once in the slow scene for a three-second, read-only attribution
; window. It groups observed state work by ProperShaders technique/pass.
EnableStateAttribution=1
StateAttributionTriggerVirtualKey=118
StateAttributionDurationMs=3000

[PerformanceRegister]
1=ProperShaders
2=Project2DFX
3=ScriptRuntime
4=Streaming
5=LimitAdjusters
6=RenderShared

[Performance.ProperShaders]
Enable=1
Type=Hybrid
Modules=ProperShaders.asi
SharedModules=d3dx9_43.dll;d3d9.dll
ProviderExport=BridgePerf_QueryV1
Config1=modloader\Proper Shaders\ProperShaders.ini

[Performance.Project2DFX]
Enable=1
Type=ModuleGroup
Modules=SALodLights.asi
Config1=modloader\Project2DFX\SALodLights.ini

[Performance.ScriptRuntime]
Enable=1
Type=ModuleGroup
Modules=CLEO.asi;CLEO+.cleo;SA.DebugUtils.cleo

[Performance.Streaming]
Enable=1
Type=ConfigSnapshot
Config1=modloader\Improved Streaming\ImprovedStreaming.ini

[Performance.LimitAdjusters]
Enable=1
Type=ModuleGroup
Modules=$fastman92limitAdjuster.asi;III.VC.SA.LimitAdjuster.asi;FLACompatBridge.asi
Config1=fastman92limitAdjuster_GTASA.ini
Config2=modloader\OLA\III.VC.SA.LimitAdjuster.ini

[Performance.RenderShared]
Enable=1
Type=SharedLayer
Modules=d3d9.dll;d3dx9_43.dll
