# GTA SA / ProperShaders / Project2DFX tuning.
# Keep DXVK observable while testing intermittent stutter and distant LOD pops.

d3d9.presentInterval = 1
dxgi.syncInterval = 1
dxvk.tearFree = True

d3d9.maxFrameRate = 0
dxgi.maxFrameRate = 0

d3d9.maxFrameLatency = 2
dxgi.maxFrameLatency = 2

d3d9.maxAvailableMemory = 4096
# Keep write-only dynamic vertex/index buffers in host-cached memory. The old
# cachedDynamicBuffers key is not consumed by DXVK 3.0.1.
d3d9.cachedWriteOnlyBuffers = True
# CPU-side mapped texture memory. This does not cap texture resolution or VRAM.
# Keep the DXVK 2.7.1 default for this A/B test to protect the 32-bit address space.
d3d9.textureMemory = 100
d3d9.deferSurfaceCreation = False

# GTA SA compatibility fork: prefilter exact state-block matches before they
# enter the D3D9 device setters. This preserves every real state transition.
# 2026-07-26: A/B ON as part of E-items (fork feature, was never exercised).
d3d9.gtaSaStateBlockPrefilter = True

# GTA SA compatibility fork: after a state block has been applied once, skip
# repeated Apply calls while the logical D3D9 state and block contents are
# unchanged. Reset and Capture invalidate this cache; journal blocks opt out.
d3d9.gtaSaStateBlockFastSkip = True

# GTA SA compatibility fork: delay only the backend VS/PS bind until the next
# draw. ProperShaders frequently restores and reapplies the same shader through
# D3DX state blocks with no draw in between; collapsing that transient pair
# preserves D3D9-visible state while avoiding redundant Vulkan bind commands.
d3d9.gtaSaDeferShaderBinding = True

# GTA SA compatibility fork: keep blend-factor and stencil-reference changes
# in logical D3D9 state until a draw actually consumes them. ProperShaders and
# D3DX state blocks can otherwise emit several backend commands with no draw
# between them.
d3d9.gtaSaDeferScalarStateBindings = True

# GTA SA compatibility fork: avoid emitting the same effective vertex input
# layout repeatedly when D3DX state blocks revisit an unchanged declaration,
# vertex shader, or instancing configuration.
d3d9.gtaSaInputLayoutCache = True

# GTA SA compatibility fork: coalesce dirty shared/VS/fixed-function push
# data updates for one draw into one command callback. The four Vulkan push
# writes retain their original order and values; only command-stream overhead
# is reduced.
d3d9.gtaSaCoalescePushData = True

# GTA SA compatibility fork: when specialization constants and push data are
# both dirty for one draw, submit them through one callback. Specialization is
# still applied before the push-data blocks.
d3d9.gtaSaCoalesceSpecAndPushData = True

# GTA SA compatibility fork: collect all dirty sampler objects for one draw
# into one command callback. Slot order and sampler construction are unchanged.
d3d9.gtaSaCoalesceSamplerBindings = True

# GTA SA compatibility fork: collect all dirty texture image views for one draw
# into one command callback. Unbound slots keep the existing separate mask path.
d3d9.gtaSaCoalesceTextureBindings = True

# GTA SA compatibility fork: do not queue a sampler/image-view callback when
# the exact effective binding is already queued for that slot. Reset invalidates
# the cache; real D3D9 state changes still update it and are always submitted.
d3d9.gtaSaResourceBindingCache = True

# Image clarity. 2026-07-26: samplerLodBias -0.75 -> 0. A negative LOD bias
# forces a sharper mip than the hardware picked, which is exactly what makes
# distant textures shimmer and alias. With MSAA impossible here (ProperShaders
# uses a reversed depth buffer) SMAA is the only AA, and it cannot fix mip-level
# shimmer -- it just blurs whatever edges it does catch. Removing the artificial
# sharpening removes the shimmer at its source.
d3d9.samplerAnisotropy = 16
d3d9.samplerLodBias = 0.0
d3d9.clampNegativeLodBias = True

dxvk.enableGraphicsPipelineLibrary = Auto
dxvk.enableMemoryDefrag = True
dxvk.numCompilerThreads = 0

# Lightweight performance HUD. Full allocation details and shader dumping are
# reserved for capture runs because they distort CPU-bound comparisons.
# 2026-07-26: trimmed for E-items — gpuload/cs/memory add per-frame queries.
dxvk.hud = fps,frametimes
