# GTA SA / ProperShaders / Project2DFX tuning.
# Ultra-low latency and smooth frametimes.

d3d9.presentInterval = 0
dxgi.syncInterval = 0
dxvk.tearFree = False

d3d9.maxFrameRate = 0
dxgi.maxFrameRate = 0

# 1-frame latency eliminates input lag and prevents command queue backpressure spikes
d3d9.maxFrameLatency = 1
dxgi.maxFrameLatency = 1

d3d9.maxAvailableMemory = 4096
# Keep write-only dynamic vertex/index buffers in host-cached memory.
d3d9.cachedWriteOnlyBuffers = True
d3d9.allowDirectBufferMapping = True
d3d9.deviceLocalConstantBuffers = Auto
d3d9.maxBatchSize = 0
d3d9.allowDiscard = False
d3d9.lenientClear = False
d3d9.seamlessCubes = False
d3d9.textureMemory = 100
d3d9.deferSurfaceCreation = False

# GTA SA compatibility fork: prefilter exact state-block matches before they
# enter the D3D9 device setters. This preserves every real state transition.
d3d9.gtaSaStateBlockPrefilter = True
d3d9.gtaSaCompat = True
d3d9.gtaSaCompatDiagnostics = True

# GTA SA compatibility fork: after a state block has been applied once, skip
# repeated Apply calls while the logical D3D9 state and block contents are
# unchanged.
d3d9.gtaSaStateBlockFastSkip = True

# GTA SA compatibility fork: delay only the backend VS/PS bind until the next draw.
d3d9.gtaSaDeferShaderBinding = True

# GTA SA compatibility fork: keep blend-factor and stencil-reference changes
# in logical D3D9 state until a draw actually consumes them.
d3d9.gtaSaDeferScalarStateBindings = True

# GTA SA compatibility fork: avoid emitting the same effective vertex input layout repeatedly.
d3d9.gtaSaInputLayoutCache = True

# GTA SA compatibility fork: coalesce dirty shared/VS/fixed-function push data updates.
d3d9.gtaSaCoalescePushData = True

# GTA SA compatibility fork: when specialization constants and push data are both dirty.
d3d9.gtaSaCoalesceSpecAndPushData = True

# GTA SA compatibility fork: collect all dirty sampler objects for one draw into one command callback.
d3d9.gtaSaCoalesceSamplerBindings = True

# GTA SA compatibility fork: collect all dirty texture image views for one draw into one command callback.
d3d9.gtaSaCoalesceTextureBindings = True

# GTA SA compatibility fork: do not queue a sampler/image-view callback when already queued.
d3d9.gtaSaResourceBindingCache = True

# GTA SA compatibility fork: authoritatively skip redundant constant uploads via SIMD vector comparison.
d3d9.gtaSaConstantDedup = True

d3d9.samplerAnisotropy = 16
d3d9.samplerLodBias = 0.0
d3d9.clampNegativeLodBias = True

dxvk.enableGraphicsPipelineLibrary = Auto
dxvk.enableMemoryDefrag = True
dxvk.numCompilerThreads = 0
dxvk.useRawBufferSlots = True

# Full Comprehensive Diagnostic HUD:
# Displays: Version, DevInfo (GPU/Driver), FPS, Frametimes graph, Submissions,
# DrawCalls count, Pipelines, Descriptors, Memory (Heaps), Allocations (Memory Chunks/Pages), GPU Load, CS thread, Compiler activity.
dxvk.hud = version,devinfo,fps,frametimes,submissions,drawcalls,pipelines,descriptors,memory,allocations,cs,gpuload,compiler,scale=1.0



